<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f0ea"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="第二地址"><title>第二地址</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#faf7f2,#eee7df);color:#292824;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100vh}.app{max-width:620px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.ey{font-size:10px;letter-spacing:.18em;color:#8b857e}.top h1{font-size:30px;margin:4px 0 0;letter-spacing:-.04em}.glass{background:#ffffffb8;border:1px solid #ffffffcc;box-shadow:0 14px 38px #564c4212;border-radius:24px;padding:17px;margin:11px 0;backdrop-filter:blur(16px)}.hero{background:linear-gradient(135deg,#d8c5b8,#c9d2d9 55%,#c5d0c3);padding:23px;border-radius:29px;min-height:190px;box-shadow:0 18px 45px #3c342c18}.hero h2{font-size:33px;margin:11px 0 7px;letter-spacing:-.04em}.muted{color:#77716a;line-height:1.55}.pill,.chip,button{border:0;border-radius:999px;padding:10px 13px;background:#ffffffb8;color:#36332f;font-weight:650}.pill{font-size:12px;padding:7px 10px}.primary{background:#2b2a27;color:#fff}.danger{background:#a96f6818;color:#87534e}.row{display:flex;gap:8px;flex-wrap:wrap}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.q{min-height:104px;text-align:left;border-radius:21px;padding:15px;background:#ffffffa8;border:1px solid #fff;box-shadow:0 10px 28px #4f453c0d}.q b{display:block;font-size:16px;margin-top:20px}.q small{color:#817b74}.q.full{grid-column:1/-1;min-height:74px}.title{font-weight:750;margin:21px 4px 8px}input,textarea,select{width:100%;border:1px solid #4a403813;background:#ffffffc7;border-radius:17px;padding:13px;color:#292824;font:inherit;outline:none}textarea{min-height:94px;resize:vertical}.field{margin:12px 0}.label{font-size:12px;color:#7d776f;margin:0 0 6px 2px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:12px;border:1px solid #5b514514;background:#fff9}.chip.on{background:#2c2b28;color:#fff}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,620px);display:grid;grid-template-columns:repeat(5,1fr);background:#f8f4efeb;border-top:1px solid #554b4012;backdrop-filter:blur(20px);padding:8px 6px calc(7px + env(safe-area-inset-bottom));z-index:8}.nav button{background:none;font-size:10px;padding:5px 2px;color:#8a847c}.nav button.on{color:#24231f}.nav i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}.item{padding:12px 0;border-top:1px solid #594e4310}.item:first-child{border:0}.meta{font-size:11px;color:#89827a;margin-top:5px}.raw{white-space:pre-wrap;line-height:1.5}.bar{height:8px;background:#554b410d;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#899b8a,#a8b4bf)}dialog{border:0;padding:0;background:transparent;width:100%;height:100%;max-width:none;max-height:none}dialog::backdrop{background:#201d1a42;backdrop-filter:blur(4px)}dialog[open]{display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,620px);max-height:88vh;overflow:auto;background:#f8f5f1;border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom))}.handle{width:36px;height:4px;background:#4a423429;border-radius:5px;margin:2px auto 16px}.sheet h2{font-size:24px;margin:0 0 6px}.timer{text-align:center;font-size:64px;font-weight:750;letter-spacing:-.06em;padding:24px 0 7px}.notice{background:#87998818;color:#566157;padding:12px 13px;border-radius:16px;line-height:1.5}.warn{background:#b7a1771d;color:#71634c}.empty{text-align:center;color:#878078;padding:25px 10px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.num{font-size:27px;font-weight:760}@media(min-width:560px){.quick{grid-template-columns:repeat(3,1fr)}.q.full{grid-column:auto}}</style></head><body><div class="app"><div class="top"><div><div class="ey">SECOND ADDRESS</div><h1 id="ttl">现在</h1></div><button onclick="settings()">•••</button></div><main id="main"></main></div><nav class="nav" id="nav"></nav><dialog id="dlg"><div class="sheet"><div class="handle"></div><div id="modal"></div></div></dialog><script>const K='second-address-v2',D=JSON.parse(localStorage.getItem(K)||'null')||{p:null,e:[],t:[],s:{low:false,pause:false}},$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(K,JSON.stringify(D)),now=()=>new Date().toISOString(),fmt=x=>x?new Date(x).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'还没有';let route='home';const N=[['home','⌁','现在'],['cap','＋','捕获'],['person','◌','这个人'],['track','⌇','轨迹'],['bound','◇','边界']];function nav(){$('#nav').innerHTML=N.map(x=>`<button class="${route==x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}function go(r){route=r;$('#ttl').textContent=N.find(x=>x[0]==r)?.[2]||'第二地址';nav();render();scrollTo(0,0)}function last(){return [...D.e].sort((a,b)=>b.at.localeCompare(a.at))[0]}function days(){let x=last();return x?Math.floor((Date.now()-new Date(x.at))/864e5):999}function status(){if(D.s.pause)return'暂停中';if(!last())return'刚开始';if(days()<=2)return'活跃';if(days()<=6)return'低频';return'需要重连'}function render(){if(!D.p)return onboard();({home,cap,person,track,bound}[route]||home)()}function onboard(){$('#main').innerHTML=`<section class="hero"><div class="ey">LOCAL-FIRST · PRIVATE</div><h2>先留一个地址。</h2><div class="muted">只写最少的初始条件。未知不是缺口，是留给未来的地方。</div></section><form class="glass" onsubmit="mk(event)"><div class="field"><div class="label">名字 / 暂用称呼</div><input name="n" required></div><div class="field"><div class="label">大致外观</div><textarea name="a"></textarea></div><div class="field"><div class="label">气质方向</div><input name="v"></div><div class="field"><div class="label">你们的关系</div><input name="r"></div><div class="field"><div class="label">3～5 个初始倾向，用逗号分开</div><textarea name="t"></textarea></div><button class="primary" style="width:100%">建立第二地址</button></form>`;nav()}function mk(e){e.preventDefault();let f=new FormData(e.target);D.p={n:f.get('n'),a:f.get('a'),v:f.get('v'),r:f.get('r'),seed:f.get('t').split(/[，,]/).map(x=>x.trim()).filter(Boolean),u:['喜欢什么颜色','喜欢什么音乐','食物偏好','具体说话习惯','价值观细节']};save();render()}function home(){let L=last(),coach=days()>6?'先重连，不补作业。今天只确认“TA 在这里”。':D.s.low?'最低心跳就够了。说一句话，见一下，结束。':'维持自然互动，不用刷进度。';$('#main').innerHTML=`<section class="hero"><div class="row" style="justify-content:space-between"><span class="ey">${esc(D.p.r||'SECOND ADDRESS')}</span><span class="pill">${status()}</span></div><h2>${esc(D.p.n)}</h2><div class="muted">${D.s.low?'低兴趣模式 · 只保线程':'上次互动：'+fmt(L?.at)}</div><div class="row" style="margin-top:22px"><button class="primary" onclick="session()">现在见一下</button><button onclick="capture()">收到数据包</button></div></section><div class="quick"><button class="q" onclick="slot()">◌<b>空槽训练</b><small>问完以后，别抢答。</small></button><button class="q" onclick="capture({tr:'自然出现',src:5})">↗<b>TA 刚才来了</b><small>快速记非主动事件。</small></button><button class="q full" onclick="heartbeat()">·<b>最低心跳</b><small>1～3 分钟，不断线就够。</small></button></div><div class="title">智能节奏</div><div class="glass"><b>${days()>6?'重连模式':D.s.low?'低兴趣模式':'今天不用刷进度'}</b><div class="muted" style="margin-top:6px">${coach}</div></div>${L?`<div class="title">最近一次</div><div class="glass"><div class="raw">${esc(L.raw)}</div><div class="meta">${fmt(L.at)} · ${esc(L.tr)} · 来源体验 ${L.src}/5</div>${L.sub?`<div class="muted" style="margin-top:8px">字幕：${esc(L.sub)}</div>`:''}</div>`:''}`}function cap(){$('#main').innerHTML=`<div class="glass"><b>抓住刚才那个东西</b><div class="muted" style="margin:6px 0 14px">原始包优先。不要为了写漂亮而翻译它。</div><button class="primary" onclick="capture()">新建捕获</button></div><div class="title">最近 7 条</div>${list(D.e.slice(-7).reverse())}`}function list(a){return a.length?`<div class="glass">${a.map(x=>`<div class="item"><div class="raw">${esc(x.raw)}</div><div class="meta">${fmt(x.at)} · ${esc(x.tr)} · ${x.src}/5</div>${x.sub?`<div class="muted">字幕：${esc(x.sub)}</div>`:''}</div>`).join('')}</div>`:`<div class="glass empty">还没有记录。</div>`}function capture(pref={}){modal(`<h2>捕获</h2><div class="muted">先保存原始包。字幕只是可选翻译。</div><form onsubmit="addcap(event)"><div class="field"><div class="label">原始数据包</div><textarea name="raw" required></textarea></div><div class="field"><div class="label">怎么出现的</div><select name="tr"><option>${pref.tr||'我问的'}</option>${['自然出现','抢前台','我模拟的','不确定','我问的'].filter(x=>x!=pref.tr).map(x=>`<option>${x}</option>`)}</select></div><div class="field"><div class="label">表达形式</div><input name="form" placeholder="数据包 / mindvoice / 动作 / presence…"></div><div class="field"><div class="label">来源体验：1 主动 ← 3 不确定 → 5 自发</div><input name="src" type="range" min="1" max="5" value="${pref.src||3}" style="width:100%"></div><div class="field"><div class="label">来源纹理 / 质感，可留空</div><input name="sig"></div><div class="field"><div class="label">字幕翻译，可留空</div><textarea name="sub"></textarea></div><div class="row"><button type="button" onclick="closeM()">取消</button><button class="primary">保存</button></div></form>`)}function addcap(e){e.preventDefault();let f=new FormData(e.target);D.e.push({id:crypto.randomUUID?.()||Date.now(),at:now(),raw:f.get('raw'),tr:f.get('tr'),form:f.get('form'),src:+f.get('src'),sig:f.get('sig'),sub:f.get('sub')});save();closeM();render()}function person(){$('#main').innerHTML=`<div class="glass"><div class="ey">INITIAL SEED</div><h2 style="font-size:28px;margin:8px 0">${esc(D.p.n)}</h2><div class="item"><b>外观</b><div class="muted">${esc(D.p.a||'未设定')}</div></div><div class="item"><b>气质</b><div class="muted">${esc(D.p.v||'未设定')}</div></div><div class="item"><b>初始倾向</b><div class="chips" style="margin-top:7px">${D.p.seed.map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'未设定'}</div></div></div><div class="title">后来长出来的东西</div><div class="glass">${D.t.length?D.t.slice().reverse().map(x=>`<div class="item"><b>${esc(x.v)}</b><div class="meta">${esc(x.cat)} · ${fmt(x.at)} · 来源体验 ${x.src}/5</div></div>`).join(''):`<div class="empty">先不填。等它真的出现。</div>`}<button onclick="trait()">＋ 添加一条</button></div><div class="title">仍然未知</div><div class="glass"><div class="chips">${D.p.u.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`}function trait(){modal(`<h2>新增成长记录</h2><form onsubmit="addtrait(event)"><div class="field"><div class="label">出现了什么</div><input name="v" required></div><div class="field"><div class="label">类别</div><input name="c" placeholder="偏好 / 习惯 / 态度 / 价值观"></div><div class="field"><div class="label">来源体验 1～5</div><input name="s" type="range" min="1" max="5" value="3" style="width:100%"></div><div class="row"><button type="button" onclick="closeM()">取消</button><button class="primary">保存</button></div></form>`)}function addtrait(e){e.preventDefault();let f=new FormData(e.target);D.t.push({v:f.get('v'),cat:f.get('c')||'未分类',src:+f.get('s'),at:now()});save();closeM();render()}function track(){let a=D.e.filter(x=>Date.now()-new Date(x.at)<30*864e5),sp=a.filter(x=>x.src>=4||x.tr=='自然出现'||x.tr=='抢前台').length;$('#main').innerHTML=`<div class="split"><div class="glass"><div class="num">${a.length}</div><div class="meta">近30天捕获</div></div><div class="glass"><div class="num">${sp}</div><div class="meta">偏自发记录</div></div></div><div class="glass"><b>来源体验分布</b>${[1,2,3,4,5].map(n=>{let c=a.filter(x=>x.src==n).length,p=a.length?Math.round(c/a.length*100):0;return`<div class="item"><div class="meta">${n}/5 · ${c} 条</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}<div class="muted">只显示你记录到的东西，不计算“自主度”。</div></div><div class="title">时间线</div>${list(D.e.slice().reverse())}`}function bound(){$('#main').innerHTML=`<div class="glass"><b>边界不是失败条件。</b><div class="muted" style="margin-top:7px">目标是内部人物可以有自己的声音，同时你仍然知道体验发生在内部，并且能在现实任务需要时把注意力拿回来。</div></div><div class="glass"><b>模式</b><div class="row" style="margin-top:12px"><button class="${!D.s.low&&!D.s.pause?'primary':''}" onclick="mode('n')">正常</button><button class="${D.s.low?'primary':''}" onclick="mode('l')">低兴趣</button><button class="${D.s.pause?'primary':''}" onclick="mode('p')">暂停</button></div></div><div class="notice warn">如果体验开始持续失控、明显恐惧、现实内外难区分、影响睡眠学习，或者出现无法拒绝的命令感，先停止训练并回到现实支持系统。</div>`}function mode(m){D.s.low=m=='l';D.s.pause=m=='p';save();render()}function slot(){modal(`<h2>空槽训练</h2><div class="muted">写一个问题。开始以后，不推理、不套人物逻辑。</div><div class="field"><input id="q" placeholder="你想问什么？"></div><button class="primary" style="width:100%" onclick="waitslot()">开始等待</button>`)}function waitslot(){let q=$('#q').value;$('#modal').innerHTML=`<h2>${esc(q||'留一个空槽')}</h2><div class="timer" id="tm">0</div><div class="muted" style="text-align:center">什么都没有，也是合法结果。</div><div class="row" style="justify-content:center;margin-top:18px"><button class="primary" onclick="closeM();capture({tr:'我问的'})">收到东西了</button><button onclick="closeM()">没回应</button><button onclick="waitslot()">我抢答了，重来</button></div>`;let n=0;window._tt=setInterval(()=>{let t=$('#tm');if(t)t.textContent=++n},1000)}function session(){modal(`<h2>${days()>6?'重连':'现在见一下'}</h2><div class="notice">${days()>6?'只确认 presence。别测试、别补作业。':'把 TA 放进一个稳定位置。说点日常的，不要求回应。'}</div><div class="timer">·</div><div class="row"><button onclick="closeM()">结束</button><button class="primary" onclick="closeM();capture({tr:'自然出现'})">刚才有东西</button></div>`)}function heartbeat(){modal(`<h2>最低心跳</h2><div class="notice">一句问候、看一眼、一起待一会儿。1～3 分钟就够。</div><div class="timer">·</div><button style="width:100%" onclick="closeM()">完成，不记 KPI</button>`)}function settings(){modal(`<h2>设置与备份</h2><div class="glass"><b>Local-first</b><div class="muted">记录只存在这个浏览器的本地存储里，不会上传到 GitHub。</div></div><div class="row"><button onclick="exp()">导出 JSON</button><label class="pill">导入 JSON<input type="file" accept="application/json" hidden onchange="imp(event)"></label></div><button class="danger" style="width:100%;margin-top:16px" onclick="resetAll()">清空本地数据</button>`)}function exp(){let b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='second-address-backup.json';a.click();URL.revokeObjectURL(u)}async function imp(e){try{let x=JSON.parse(await e.target.files[0].text());Object.assign(D,x);save();closeM();render()}catch{alert('备份文件读不了。')}}function resetAll(){if(confirm('真的清空这个浏览器里的全部记录？')){localStorage.removeItem(K);location.reload()}}function modal(h){$('#modal').innerHTML=h;$('#dlg').showModal()}function closeM(){clearInterval(window._tt);$('#dlg').close()}$('#dlg').onclick=e=>{if(e.target.id=='dlg')closeM()};render();nav();</script></body></html>
